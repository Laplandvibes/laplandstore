name: Deploy to Cloudflare Pages

# Lisatty 10.9.2026. Tasta reposta PUUTTUI workflow kokonaan, joten `git push`
# ei julkaissut mitaan — muutokset elivat vain gitissa ja live jai vanhaksi,
# kunnes joku muisti ajaa wranglerin kasin. Ks. muisti julkaisu-ei-ole-yksi-reitti.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time per branch. A push that arrives while a deploy is
# running waits for it; if a newer push arrives meanwhile, the older waiting
# run is dropped (the newer commit contains it), so the newest commit always
# deploys last. Without this, two pushes a few minutes apart deployed in
# parallel and whichever finished last won production.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      # 🔴🔴 FAIL-CLOSED. Ilman tokenia wrangler-action kaatuu vasta buildin
      # jalkeen epaselvaan virheeseen, ja aiemmin taalla oli fail-open-portteja
      # jotka sammuttivat itsensa juuri kun niita olisi tarvittu. Sano se heti
      # ja selvasti: punainen = ei julkaistu.
      - name: Tarkista julkaisusalaisuudet
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Repon saloista puuttuu:$missing — sivusto EI julkaistu. Lisaa: gh secret set <NIMI> -R Laplandvibes/<repo>"
            exit 1
          fi
          echo "Salaisuudet kunnossa."

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      # ─── LV-PORTIT-CI (13.11.2026) ──────────────────────────────────────────────────────
      # lv-opsin dist-portit ennen julkaisua, sama ajuri ja samat portit kuin deploy-safe.sh:ssa
      # (node scripts/portti.mjs --site <sivusto> --taso dist). lv-ops on yksityinen ja luetaan vain luku
      # -avaimella (lv-opsin deploy key, salaisuus LV_OPS_DEPLOY_KEY). Kaatunut portti PYSÄYTTÄÄ julkaisun.
      # Jos lv-opsia ei saada (avain puuttuu, GitHub-katko), julkaisu jatkuu varoituksella.
      # Hätäohitus: Actions-muuttuja LV_PORTIT_POIS=1 (repo tai organisaatio); kirjaa syy.
      - name: LV-portit — lv-ops (vain luku)
        id: lvops
        if: ${{ vars.LV_PORTIT_POIS != '1' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Laplandvibes/lv-ops
          ssh-key: ${{ secrets.LV_OPS_DEPLOY_KEY }}
          path: _lv-ops

      - name: LV-portit — Node 24 (sama kuin deploy-safe.sh)
        if: ${{ vars.LV_PORTIT_POIS != '1' && steps.lvops.outcome == 'success' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: LV-portit — dist
        if: ${{ vars.LV_PORTIT_POIS != '1' && steps.lvops.outcome == 'success' }}
        env:
          SIVUSTO_DIR: laplandstore-new
        run: |
          # Portit etsivät sivuston lv-opsin juuresta (<lv-ops>/<sivusto>), kuten Vesan koneella.
          mv _lv-ops "$RUNNER_TEMP/lv-ops"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/lv-ops/$SIVUSTO_DIR"
          cd "$RUNNER_TEMP/lv-ops"
          npm ci --no-audit --no-fund
          node scripts/portti.mjs --site "$SIVUSTO_DIR" --taso dist

      # Julkaisuvaihe ajetaan sivuston omalla Node-versiolla, kuten ennen tätä lohkoa.
      - name: LV-portit — sivuston oma Node takaisin
        if: ${{ vars.LV_PORTIT_POIS != '1' && steps.lvops.outcome == 'success' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: LV-portit — ohitettu
        if: ${{ vars.LV_PORTIT_POIS == '1' || steps.lvops.outcome != 'success' }}
        run: echo "::warning::LV-portit ohitettu (LV_PORTIT_POIS='${{ vars.LV_PORTIT_POIS }}', lv-ops-haku='${{ steps.lvops.outcome }}')"
      # ─── /LV-PORTIT-CI ───────────────────────────────────────────────────────────────────

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=laplandstore --branch=main
